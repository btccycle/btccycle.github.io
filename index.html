<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC Cycle Tracker — 비트코인 사이클 비교 분석</title>
<meta name="description" content="Bitcoin halving-cycle tracker: overlays past cycles on today, measures price and time gaps, and projects the next top. 비트코인 반감기 사이클 비교·다음 고점 분석.">
<meta property="og:type" content="website">
<meta property="og:title" content="BTC Cycle Tracker — Bitcoin halving-cycle analytics">
<meta property="og:description" content="Which past cycle is today most like, how far apart in price and time, and where the next top could land.">
<meta property="og:image" content="https://btccycle.github.io/og-image.png">
<meta property="og:url" content="https://btccycle.github.io/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="BTC Cycle Tracker">
<meta name="twitter:description" content="Bitcoin halving-cycle analytics · live CoinGecko data">
<meta name="twitter:image" content="https://btccycle.github.io/og-image.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233987e5'/%3E%3Cpath d='M8 22 L14 14 L18 18 L24 9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0e0e0d; --surface-1:#1a1a19; --surface-2:#222220; --line:#2e2e2b; --line-2:#3a3a36;
  --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8e86;
  --c4:#3987e5; --c3:#d95926; --c2:#199e70; --c1:#c98500; --comp:#a3a29a;
  --good:#0ca30c; --bad:#e66767; --rec:#6e6d66;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'IBM Plex Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-muted);text-transform:uppercase}
.brand h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.brand h1 span{color:var(--c4)}
.brand p{margin:0;color:var(--text-secondary);font-size:13px}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lang{display:inline-flex;background:var(--surface-1);border:1px solid var(--line);border-radius:7px;padding:2px}
.lang a{color:var(--text-secondary);text-decoration:none;font:600 11.5px var(--mono);padding:4px 10px;border-radius:5px;letter-spacing:.04em}
.lang a.on{background:var(--surface-2);color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--line-2)}
.status{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);text-align:right;line-height:1.6}
.status b{color:var(--text-secondary);font-weight:500}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}

.phase{background:linear-gradient(180deg,#1d1d1b,#191918);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px;align-items:center}
.phase .pk{font:500 11px var(--mono);letter-spacing:.12em;color:var(--text-muted);text-transform:uppercase}
.phase .pv{font-size:17px;font-weight:700;margin:4px 0 4px}
.phase .pv span{color:var(--c4)}
.phase .ps{font-size:12px;color:var(--text-secondary);line-height:1.55}
.ptrack{position:relative;height:30px;background:var(--bg);border-radius:6px;margin:16px 0 22px}
.ptrack .fill{position:absolute;top:0;bottom:0;border-radius:6px 0 0 6px}
.ptrack .band{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(12,163,12,.22) 0 6px,rgba(12,163,12,.08) 6px 12px);border-left:1px solid rgba(12,163,12,.6);border-right:1px solid rgba(12,163,12,.6)}
.ptrack .mk{position:absolute;top:-6px;bottom:-6px;width:2px}
.ptrack .ml{position:absolute;font:500 10.5px var(--mono);white-space:nowrap;transform:translateX(-50%)}
.ptrack .ml.up{top:-19px}.ptrack .ml.dn{bottom:-19px}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:4px}
.kpi{background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .k{font-size:11.5px;color:var(--text-muted);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.kpi .s{font-family:var(--mono);font-size:11px;color:var(--text-secondary);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neg{color:var(--bad)} .pos{color:var(--good)}

.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;position:sticky;top:0;z-index:5}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px}
.seg button{background:none;border:0;color:var(--text-secondary);font:500 12px var(--sans);padding:5px 10px;border-radius:5px;cursor:pointer}
.seg button.on{background:var(--surface-2);color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--line-2)}
select,input[type=number],input[type=date]{background:var(--bg);color:var(--text-primary);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:12px var(--mono)}
label.tg{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text-secondary);font-size:12.5px}
label.tg input{accent-color:var(--c4)}

.grid2{display:grid;grid-template-columns:1.65fr 1fr;gap:14px;margin-bottom:14px}
.grid2.even{grid-template-columns:1.15fr 1fr}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;min-width:0}
.card h2{margin:0 0 2px;font-size:14.5px;font-weight:600}
.card .sub{font-size:12px;color:var(--text-muted);margin:0 0 10px;line-height:1.5}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 8px;font-size:12px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:6px;user-select:none}
#legend1 span{cursor:pointer}
.legend span.off{opacity:.38}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--comp) 0 4px,transparent 4px 7px)!important}
.legend i.blk{width:12px;height:9px}
.chartbox{position:relative;height:420px}
.chartbox.sm{height:260px}
.chartbox.md{height:330px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
th,td{padding:8px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--text-muted);font-size:11.5px}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--mono);color:var(--text-primary)}
td.name{font-family:var(--sans);font-weight:500}
td.fn{font-family:var(--sans);white-space:normal;text-align:left;font-size:11.5px;color:var(--text-muted)}
tr.cur td{background:rgba(57,135,229,.07)}
tr.avg td{color:var(--text-secondary)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:0}
.bar{position:relative;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;width:70px;display:inline-block;vertical-align:middle;margin-left:8px}
.bar b{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.muted{color:var(--text-muted)}
.small{font-size:10.5px}
.note{font-size:12px;color:var(--text-secondary);line-height:1.65}
.insight{border-left:3px solid var(--c4);background:var(--surface-2);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;line-height:1.7;color:var(--text-secondary);margin-bottom:12px}
.insight b{color:var(--text-primary);font-weight:600}

.tl{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.tlrow{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:center;font-size:12px}
.tlrow .lab{color:var(--text-secondary);font-weight:500;font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.track{position:relative;height:22px;background:var(--bg);border-radius:5px}
.seg2{position:absolute;top:3px;bottom:3px;border-radius:3px;display:flex;align-items:center;justify-content:center;font:500 10.5px var(--mono);color:#0e0e0d;overflow:hidden;white-space:nowrap}
.seg2.acc,.seg2.rec{background:#4b4b46;color:var(--text-primary)}
.seg2.bull{background:var(--good)}
.seg2.bear{background:var(--bad)}
.seg2.proj{background:transparent;border:1.5px dashed var(--text-muted);color:var(--text-secondary)}
.seg2.projg{background:transparent;border:1.5px dashed var(--good);color:var(--text-secondary)}
.tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-primary)}
.tlaxis{position:relative;height:16px;margin-left:96px;font:10.5px var(--mono);color:var(--text-muted)}
.tlaxis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
#athAxis span:last-child{transform:translateX(-100%)}
#athAxis span:first-child{transform:none}
.zero{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--text-muted)}
.todaymark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--c4)}

.datap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.btn{background:var(--surface-2);border:1px solid var(--line-2);color:var(--text-primary);font:500 12px var(--sans);padding:6px 11px;border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--text-muted)}
details{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px}
details summary{cursor:pointer;font-weight:600;font-size:14px}
details .note p{margin:8px 0}
code{font-family:var(--mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);padding:1px 5px;border-radius:4px;color:var(--text-secondary)}
footer{margin-top:22px;font-size:11.5px;color:var(--text-muted);line-height:1.7}
footer a{color:var(--text-secondary)}
.live{display:flex;align-items:center;gap:8px;font:500 11.5px var(--mono);color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--line);border-radius:7px;padding:5px 10px;max-width:420px;text-align:right}
.live .pulse{width:8px;height:8px;border-radius:50%;flex:none;background:var(--text-muted)}
.live.on .pulse{background:var(--good);box-shadow:0 0 0 0 rgba(12,163,12,.6);animation:pl 2s infinite}
.live.warn .pulse{background:#c98500}
.live.off .pulse{background:var(--bad)}
.live button{background:var(--c4);color:#fff;border:0;border-radius:5px;padding:3px 8px;font:600 11px var(--sans);cursor:pointer}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(12,163,12,.55)}70%{box-shadow:0 0 0 7px rgba(12,163,12,0)}100%{box-shadow:0 0 0 0 rgba(12,163,12,0)}}
.fc{background:linear-gradient(180deg,#1b1f26,#181a1d);border:1px solid #2c3442;border-radius:14px;padding:16px;margin-bottom:4px}
.fc .pk{font:600 11px var(--mono);letter-spacing:.14em;color:#7fb0ef}
.fc h2{margin:4px 0 2px;font-size:18px}
.fc .sub{font-size:12px;color:var(--text-muted);line-height:1.5}
.fcgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:14px;margin-top:12px}
.fcl{display:flex;flex-direction:column;gap:10px}
.ans{background:var(--surface-1);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.ans .q{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:8px}
.ans .q b{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#26354a;color:#9cc3f5;font:600 11px var(--mono);align-items:center;justify-content:center}
.ans .a{font:600 26px var(--mono);letter-spacing:-.02em;margin:6px 0 4px;white-space:nowrap}
.ans .a small{font:500 13px var(--sans);color:var(--text-secondary);margin-left:8px;letter-spacing:0}
.ans .d{font-size:12.5px;color:var(--text-secondary);line-height:1.75}
.ans .d b{color:var(--text-primary);font-family:var(--mono);font-weight:600}
.fcr{background:var(--surface-1);border:1px solid var(--line);border-radius:11px;padding:12px 12px 6px;min-width:0}
.disc{font-size:11.5px;color:var(--text-muted);margin:10px 2px 0;line-height:1.6}
.xbtn{display:inline-flex;align-items:center;gap:6px;background:#f0efec;color:#0e0e0d;text-decoration:none;font:600 12px var(--sans);padding:5px 11px;border-radius:7px}
.xbtn:hover{background:#fff}
.secl{display:flex;align-items:baseline;gap:10px;margin:22px 2px 10px;flex-wrap:wrap}
.secl span{font:600 11px var(--mono);color:#7fb0ef;letter-spacing:.1em}
.secl b{font-size:16px;font-weight:700}
.secl em{font-style:normal;font-size:12px;color:var(--text-muted)}
.secl.big{border-top:1px solid var(--line);padding-top:22px;margin-top:30px}
.nowgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px}
.nowgrid .phase{margin:0;grid-template-columns:1fr;gap:6px;align-items:start}
.nowcard{padding:16px}
.nowcard .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.nowcard .hd .big{font:700 22px var(--mono)}
.nowcard .hd .tag{font:600 11px var(--mono);padding:3px 8px;border-radius:999px;background:#26354a;color:#9cc3f5}
.nowlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.nowlist li{display:grid;grid-template-columns:64px 1fr;gap:10px;font-size:13px;line-height:1.55;color:var(--text-secondary)}
.nowlist li>span{font:600 11px var(--mono);color:var(--text-muted);padding-top:2px}
.nowlist b{color:var(--text-primary);font-family:var(--mono);font-weight:600}
.nowcard .bottom{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-secondary);line-height:1.6}
details.more{background:transparent;border:0;padding:0;margin-top:12px}
details.more summary{font-size:12.5px;font-weight:500;color:#9cc3f5;padding:6px 2px}
.kpi:first-child{border-color:#2c3f5c;background:linear-gradient(180deg,#1b2433,#1a1a19)}
.kpi .v{font-size:23px}
.dca{background:var(--surface-1);border:1px solid var(--line);border-radius:11px;padding:14px;margin-top:14px}
.dcahead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:10px}
.dca .pk{font:600 11px var(--mono);letter-spacing:.12em;color:#7fb0ef}
.dca h3{margin:4px 0 0;font-size:16px}
.dcactl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--text-secondary)}
.dcactl label{display:flex;align-items:center;gap:4px}
.dcactl input{width:90px}
.dcactl .usd{color:var(--text-muted);font-family:var(--mono)}
.dcagrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1000px){.dcagrid{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line-2);padding:8px 14px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}

@media (max-width:1000px){.fcgrid,.nowgrid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.grid2,.grid2.even{grid-template-columns:1fr}.phase{grid-template-columns:1fr}}
@media (max-width:560px){
  .hm{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}.kpi .v{font-size:18px}
  .chartbox{height:340px}.brand h1{font-size:20px}.status{text-align:left}.hright{align-items:flex-start}
  .controls{position:static}
  .tlrow{grid-template-columns:70px 1fr}.tlaxis{margin-left:80px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Bitcoin · Halving Cycle Analytics</div>
      <h1>BTC <span>Cycle</span> Tracker</h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="hright">
      <div style="display:flex;gap:8px;align-items:center"><a class="xbtn" id="xShare" href="https://x.com/intent/tweet" target="_blank" rel="noopener">𝕏 <span id="xShareT">Share</span></a><nav class="lang"><a href="#ko" id="lk">한국어</a><a href="#en" id="le">EN</a></nav></div>
      <div class="live" id="live"></div>
      <div class="status" id="status"></div>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <div class="secl"><span>01</span><b data-i18n="secNow"></b></div>
  <section class="nowgrid">
    <div class="card nowcard" id="nowAnalysis"></div>
    <section class="phase" id="phase"></section>
  </section>

  <div class="secl"><span>02</span><b data-i18n="secFc"></b></div>
  <section class="fc">
    <div class="pk">ANALOG FORECAST</div>
    <h2 id="fcTitle"></h2>
    <p class="sub" id="fcSub" style="margin:0"></p>
    <div class="fcgrid">
      <div class="fcl"><div class="ans" id="ans1"></div><div class="ans" id="ans2"></div><div class="ans" id="ans3"></div></div>
      <div class="fcr">
        <div class="legend" id="legendFc"></div>
        <div class="chartbox md"><canvas id="fcChart"></canvas></div>
        <div class="tblwrap"><table id="fcTbl"></table></div>
      </div>
    </div>
    <div class="dca">
      <div class="dcahead">
        <div><div class="pk" data-i18n="dcaKicker"></div><h3 id="dcaTitle"></h3><p class="sub" id="dcaSub" style="margin:2px 0 0"></p></div>
        <div class="dcactl">
          <label><span data-i18n="dcaAmt"></span> <span class="usd">$</span><input type="number" id="dcaAmt" min="1" step="10" value="100"></label>
          <select id="dcaFreq"><option value="7" data-i18n="dcaW"></option><option value="14" data-i18n="dcaBW"></option><option value="30" data-i18n="dcaM"></option></select>
        </div>
      </div>
      <div class="dcagrid">
        <div class="tblwrap"><table id="dcaTbl"></table></div>
        <div><div class="legend" id="dcaLegend"></div><div class="chartbox sm"><canvas id="dcaChart"></canvas></div></div>
      </div>
      <p class="disc" id="dcaNote" style="margin-top:6px"></p>
    </div>
    <details class="more"><summary data-i18n="fcMore"></summary><div class="tblwrap" style="margin-top:8px"><table id="fcAll"></table></div></details>
    <p class="disc" id="fcDisc"></p>
  </section>

  <div class="secl big"><span>03</span><b data-i18n="secDetail"></b><em data-i18n="secDetailSub"></em></div>
  <div class="controls">
    <div class="ctl"><span data-i18n="ctlAnchor"></span>
      <div class="seg" id="anchorSeg">
        <button data-v="halving" class="on" data-i18n="aHalving"></button>
        <button data-v="prevBottom" data-i18n="aPrevBottom"></button>
        <button data-v="top" data-i18n="aTop"></button>
      </div>
    </div>
    <div class="ctl"><span data-i18n="ctlY"></span>
      <div class="seg" id="ySeg">
        <button data-v="mult" class="on" data-i18n="yMult"></button>
        <button data-v="dd" data-i18n="yDd"></button>
      </div>
    </div>
    <div class="ctl"><span data-i18n="ctlWin"></span>
      <select id="winSel">
        <option value="anchor" data-i18n="wAnchor"></option>
        <option value="365" data-i18n="w365"></option>
        <option value="180" data-i18n="w180"></option>
        <option value="full" data-i18n="wFull"></option>
      </select>
    </div>
    <label class="tg"><input type="checkbox" id="projTg" checked> <span data-i18n="tgProj"></span></label>
    <label class="tg"><input type="checkbox" id="lagTg"> <span data-i18n="tgLag"></span></label>
    <label class="tg"><input type="checkbox" id="ampTg"> <span data-i18n="tgAmp"></span></label>
  </div>

 hData:['데이터 관리 — 현재가 입력 · 일봉 CSV 불러오기','Data — set current price · import daily CSV'],
 manualPx:['현재가 수동 입력','Set current price'], apply:['적용','Apply'], csvLab:['일봉 CSV','Daily CSV'], reset:['내장 데이터로 초기화','Reset to built-in data'],
 csvHelp:['CSV는 날짜 열(<code>date</code>, <code>snapped_at</code>, <code>timestamp</code> 등)과 가격 열(<code>close</code>, <code>price</code>)을 자동 인식합니다. CoinGecko·Yahoo Finance·CoinMarketCap 내보내기 형식 그대로 사용할 수 있고, 불러온 기간은 내장 데이터를 대체합니다. 불러온 데이터는 이 브라우저에만 저장됩니다.','Date columns (<code>date</code>, <code>snapped_at</code>, <code>timestamp</code>…) and price columns (<code>close</code>, <code>price</code>) are detected automatically. CoinGecko, Yahoo Finance and CoinMarketCap exports work as-is; the imported range replaces built-in data. Imported data is stored in this browser only.'],
 hMethod:['방법론 · 수식','Methodology & formulas'],
 method:[`<p><b>정규화.</b> 각 사이클 c의 기준일 a<sub>c</sub>(반감기/직전 바닥/고점)로부터 x일 경과 시점의 값을 <code>L_c(x) = ln P(a_c + x) − ln P(a_c)</code>로 정의합니다. 모든 비교는 이 로그 배수 공간에서 이뤄지며, 차트의 배수는 <code>e^{L}</code>입니다.</p>
<p><b>레벨 상관 r<sub>L</sub>.</b> 비교 구간에서 L<sub>now</sub>(x)와 L<sub>c</sub>(x)의 피어슨 상관. 추세가 같으면 높게 나오는 경향이 있어 단독으로 쓰지 않습니다.</p>
<p><b>수익률 상관 r<sub>R</sub>.</b> 14일 로그 수익률을 7일 간격으로 샘플링한 계열 간 상관. 추세 효과를 제거한 형태 유사성 지표입니다.</p>
<p><b>가격 괴리.</b> 편향 <code>b = mean(L_now − L_c)</code> → <code>e^b − 1</code>은 "같은 경과일에 현재가 과거 경로보다 몇 % 위/아래인가". RMSE <code>√mean((L_now − L_c)²)</code> → <code>e^{RMSE} − 1</code>은 평균적인 절대 괴리 폭.</p>
<p><b>진폭비 β와 형태 오차.</b> 회귀 <code>L_now = α + β·L_c</code>의 기울기 β는 현재 사이클이 과거 움직임의 몇 배 진폭으로 움직이는지(수익 체감)이며, 잔차 RMSE를 형태 오차로 씁니다.</p>
<p><b>시간 괴리 ① 최적 시차 τ.</b> 최근 365일 구간에서 과거 경로를 τ ∈ [−240, +240]일 이동시키며 <code>corr(L_now(x), L_c(x+τ))</code>를 최대화하는 τ. τ &gt; 0이면 오늘이 과거 사이클의 τ일 뒤 시점과 닮았다는 뜻으로 현재가 <b>앞서</b> 진행 중입니다.</p>
<p><b>시간 괴리 ② DTW 대응점.</b> 주봉 샘플에 Dynamic Time Warping(z-점수 표준화, ±26주 밴드, 끝점 개방)을 적용해 오늘이 과거 사이클의 몇 번째 날에 대응하는지 찾습니다.</p>
<p><b>시간 괴리 ③ 변곡점 시차.</b> 반감기→고점, 고점→바닥, 고점→신고점 일수를 과거와 직접 비교합니다.</p>
<p><b>고점 → 신고점.</b> 사이클 고점 종가 P<sub>T</sub> 이후 <code>P(d) &gt; P_T</code>를 처음 만족하는 날을 신고점 회복일로 봅니다. 수중 곡선은 <code>P(T+x)/P_T − 1</code>. 현재 사이클의 예상 회복일은 ①과거 평균 소요일 ②소요일의 선형 추세 ③잠정 바닥 + 평균 바닥→회복 일수, 세 가지로 제시합니다.</p>
<p><b>종합 유사도(0–100).</b> <code>100 × [0.35·max(0,r_R) + 0.25·max(0,r_L) + 0.20·e^{−RMSE_shape/0.10} + 0.20·e^{−DTW/0.35}]</code>.</p>
<p><b>투영.</b> <code>P̂(t+h) = P_now × e^{k·[L_c(t+τ+h) − L_c(t+τ)]}</code> (τ: 시차 보정 시 최적 시차, 아니면 0 · k: 진폭 보정 시 β(0.05–2로 제한), 아니면 1).</p>
<p><b>한계.</b> 표본은 사이클 3개뿐이며, ETF·거시 유동성 등 구조 변화로 수익률은 사이클마다 체감해 왔습니다. 수치는 역사적 비교용이며 투자 조언이 아닙니다.</p>`,
`<p><b>Normalization.</b> For cycle c with anchor a<sub>c</sub> (halving / prior bottom / top), the value x days later is <code>L_c(x) = ln P(a_c + x) − ln P(a_c)</code>. All comparisons happen in this log-multiple space; chart multiples are <code>e^{L}</code>.</p>
<p><b>Level correlation r<sub>L</sub>.</b> Pearson correlation of L<sub>now</sub>(x) and L<sub>c</sub>(x) over the window. Shared trend inflates it, so it is never used alone.</p>
<p><b>Return correlation r<sub>R</sub>.</b> Correlation of 14-day log returns sampled every 7 days — a detrended shape-similarity measure.</p>
<p><b>Price gap.</b> Bias <code>b = mean(L_now − L_c)</code> → <code>e^b − 1</code> = how far above/below the past path the current cycle sits at the same elapsed day. RMSE <code>√mean((L_now − L_c)²)</code> → <code>e^{RMSE} − 1</code> = typical absolute gap.</p>
<p><b>Amplitude ratio β and shape error.</b> In the regression <code>L_now = α + β·L_c</code>, β is how large the current cycle's moves are relative to the past cycle (diminishing returns); the residual RMSE is the shape error.</p>
<p><b>Time gap ① optimal lag τ.</b> Over the last 365 days, shift the past path by τ ∈ [−240, +240] days and pick the τ that maximizes <code>corr(L_now(x), L_c(x+τ))</code>. τ &gt; 0 means today resembles a later point of the past cycle — the current cycle is running <b>ahead</b>.</p>
<p><b>Time gap ② DTW match.</b> Dynamic Time Warping on weekly samples (z-scored, ±26-week band, open end) finds which day of the past cycle today corresponds to.</p>
<p><b>Time gap ③ turning-point lag.</b> Direct comparison of halving→top, top→bottom and top→new-ATH durations.</p>
<p><b>Top → new ATH.</b> The reclaim date is the first day after the cycle-top close P<sub>T</sub> with <code>P(d) &gt; P_T</code>. The underwater curve is <code>P(T+x)/P_T − 1</code>. For the current cycle, the expected reclaim date is shown three ways: ① past average duration, ② linear trend of durations, ③ provisional bottom + average bottom→reclaim days.</p>
<p><b>Overall similarity (0–100).</b> <code>100 × [0.35·max(0,r_R) + 0.25·max(0,r_L) + 0.20·e^{−RMSE_shape/0.10} + 0.20·e^{−DTW/0.35}]</code>.</p>
<p><b>Projection.</b> <code>P̂(t+h) = P_now × e^{k·[L_c(t+τ+h) − L_c(t+τ)]}</code> (τ: optimal lag when lag-adjusted, else 0 · k: β clipped to 0.05–2 when amplitude-scaled, else 1).</p>
<p><b>Limits.</b> Only three past cycles; returns have diminished each cycle amid structural change (ETFs, macro liquidity). Figures are historical comparisons, not investment advice.</p>`]
};

function buildSeries(){

  const byDay=new Map(); pts.forEach(p=>byDay.set(p[0],{p,err:EMB_ERR}));
  cg.forEach(([d,v,e])=>{ const cur=byDay.get(d); if(!cur||e<cur.err) byDay.set(d,{p:[d,v,3],err:e}); });
  pts=[...byDay.values()].map(o=>o.p);
  const imp=LS.get('btcct_import');
  if(imp&&imp.length){ const lo=imp[0][0], hi=imp[imp.length-1][0]; pts=pts.filter(p=>p[0]<lo||p[0]>hi).concat(imp.map(p=>[p[0],p[1],4])); }
  const man=LS.get('btcct_manual'); if(man) pts.push([man[0],man[1],5]);
  pts.sort((a,b)=>a[0]-b[0]||a[2]-b[2]);
  const m=new Map(); pts.forEach(p=>m.set(p[0],p));
  const P=[...m.values()].sort((a,b)=>a[0]-b[0]);
  const d0=P[0][0], d1=P[P.length-1][0], n=d1-d0+1;

    if(i<P.length-1){ const [db,vb]=P[i+1]; const la=ln(va), lb=ln(vb); for(let d=da+1;d<db;d++) arr[d-d0]=ex(la+(lb-la)*(d-da)/(db-da)); } }
  S={d0,d1,arr,real,nImported:imp?imp.length:0,manual:man,nCg:cg.length,cgRange:cg.length?[cg[0][0],cg[cg.length-1][0]]:null,cgLive:!!LS.get('btcct_cg2')};

  const cur=CY[3]; let mx=-1,mi=Infinity,T=null,B=null;
  for(let d=cur.H;d<=S.d1;d++){const p=price(d); if(p>mx){mx=p;T=d}}
  for(let d=T;d<=S.d1;d++){const p=price(d); if(p<mi){mi=p;B=d}}
  cur.T=T; cur.B1=B; cur.provisional=true;
  CY.forEach((c,i)=>{ const nx=CY[i+1]; c.next=nx?{H:nx.H,B0:nx.B0,T:nx.T}:null;
    // first close above cycle-top close = new ATH reclaim
    const pt=price(c.T); c.R=null; for(let d=c.T+1; d<=S.d1; d++){ if(price(d)>pt){c.R=d;break} } });
}
function anchorDay(c,mode){ return mode==='halving'?c.H:mode==='prevBottom'?c.B0:c.T; }
function maxX(c,mode){ if(c.current) return S.d1-anchorDay(c,mode); return anchorDay(c.next,mode)-anchorDay(c,mode); }
function L(c,x,mode=st.anchor){ const a=anchorDay(c,mode); if(x>maxX(c,mode)) return NaN; const p=price(a+x),p0=price(a); return (isFinite(p)&&isFinite(p0))?ln(p)-ln(p0):NaN; }
const Lraw=(c,x,mode=st.anchor)=>{ const a=anchorDay(c,mode); const p=price(a+x),p0=price(a); return (isFinite(p)&&isFinite(p0))?ln(p)-ln(p0):NaN; };

/* ============================== METRICS ============================== */
function winStart(t,x0){ return st.win==='anchor'?Math.max(0,x0):st.win==='full'?x0:t-(+st.win); }
function computeMetrics(){
  const cur=CY[3], {t,x0}=gridRange(), xs=winStart(t,x0), out=[];
  for(const c of CY.slice(0,3)){
    const a=[],b=[]; for(let x=xs;x<=t;x++){const u=L(cur,x),v=Lraw(c,x); if(isFinite(u)&&isFinite(v)){a.push(u);b.push(v)}}
    const rL=pearson(a,b);
    const ra=[],rb=[]; for(let x=xs+14;x<=t;x+=7){const u=L(cur,x)-L(cur,x-14),v=Lraw(c,x)-Lraw(c,x-14); if(isFinite(u)&&isFinite(v)){ra.push(u);rb.push(v)}}
    const rR=pearson(ra,rb);
    const diff=a.map((u,i)=>u-b[i]); const bias=mean(diff), rmse=Math.sqrt(mean(diff.map(d=>d*d)));
    const mu=mean(a),mv=mean(b); let sxy=0,sxx=0; for(let i=0;i<a.length;i++){sxy+=(a[i]-mu)*(b[i]-mv);sxx+=(b[i]-mv)**2}
    const beta=sxx>0?sxy/sxx:NaN, alpha=mu-beta*mv; const rmseShape=Math.sqrt(mean(a.map((u,i)=>(u-alpha-beta*b[i])**2)));
    const ls=Math.max(xs,t-365); let best={tau:0,r:-2};
    for(let tau=-240;tau<=240;tau+=2){const u1=[],v1=[]; for(let x=ls;x<=t;x+=2){const u=L(cur,x),v=Lraw(c,x+tau); if(isFinite(u)&&isFinite(v)){u1.push(u);v1.push(v)}} if(u1.length<30) continue; const r=pearson(u1,v1); if(r>best.r) best={tau,r};}
    const dtw=dtwOpen(cur,c,xs,t);
    const score=100*(0.35*Math.max(0,rR||0)+0.25*Math.max(0,rL||0)+0.20*ex(-rmseShape/0.10)+0.20*ex(-dtw.dist/0.35));
    out.push({c,rL,rR,bias,rmse,rmseShape,beta,lag:best.tau,lagR:best.r,dtw,score,n:a.length,xs,t});
  }
  return out;
}
function dtwOpen(cur,c,xs,t){
  const step=7,band=26,A=[],B=[]; for(let x=xs;x<=t;x+=step) A.push(L(cur,x));
  const bN=Math.floor((t-xs)/step)+band+1; for(let j=0;j<bN;j++) B.push(Lraw(c,xs+j*step));
  const n=A.length; if(n<6) return {dist:NaN,lag:NaN,matchX:NaN};
  const Bo=B.slice(0,n).filter(isFinite); const mA=mean(A),sA=std(A)||1,mB=mean(Bo),sB=std(Bo)||1;
  const a=A.map(v=>(v-mA)/sA), b=B.map(v=>isFinite(v)?(v-mB)/sB:NaN), m=b.length, INF=1e9;
  const D=Array.from({length:n},()=>new Float64Array(m).fill(INF)), Lp=Array.from({length:n},()=>new Uint16Array(m));
  for(let i=0;i<n;i++){ for(let j=Math.max(0,i-band);j<=Math.min(m-1,i+band);j++){
    if(!isFinite(b[j])) continue; const cost=Math.abs(a[i]-b[j]);
    if(i===0&&j===0){D[0][0]=cost;Lp[0][0]=1;continue}
    let bv=INF,bl=0;
    if(i>0&&D[i-1][j]<bv){bv=D[i-1][j];bl=Lp[i-1][j]}
    if(j>0&&D[i][j-1]<bv){bv=D[i][j-1];bl=Lp[i][j-1]}
    if(i>0&&j>0&&D[i-1][j-1]<=bv){bv=D[i-1][j-1];bl=Lp[i-1][j-1]}
    if(bv<INF){D[i][j]=bv+cost;Lp[i][j]=bl+1}
  }}
  let bj=-1,bd=INF; for(let j=0;j<m;j++){ if(D[n-1][j]<INF){ const v=D[n-1][j]/Lp[n-1][j]; if(v<bd){bd=v;bj=j} } }
  return {dist:bd,lag:(bj-(n-1))*step,matchX:xs+bj*step};
}
function projections(M){
  const t=M[0].t, now=price(S.d1), H=[30,90,180,365];
  const rows=M.map(m=>{ const tau=st.lag?m.lag:0, c=m.c, base=Lraw(c,t+tau), k=st.amp?Math.max(0.05,Math.min(2,m.beta)):1;
    const f=h=>k*(Lraw(c,t+tau+h)-base);
    const hz=H.map(h=>{const v=f(h); return isFinite(v)?now*ex(v):NaN});
    let mn=Infinity,mx=null; for(let h=0;h<=600;h++){const v=f(h); if(isFinite(v)&&v<mn){mn=v;mx=h}}
    return {m,hz,bot:(mx!=null&&mx>0)?{p:now*ex(mn),h:mx}:{p:now,h:0},tau,k,f}; });
  const comp=H.map((h,i)=>{const ls=rows.map(r=>r.hz[i]).filter(isFinite).map(ln); return ls.length?ex(mean(ls)):NaN});
  let cm=Infinity,ch=0; for(let h=0;h<=600;h++){const ls=rows.map(r=>r.f(h)).filter(isFinite); if(ls.length===rows.length){const v=mean(ls); if(v<cm){cm=v;ch=h}}}
  return {rows,comp,compBot:{p:now*ex(Math.min(cm,0)),h:cm<0?ch:0},H,now};
}
function athStats(){
  const past=CY.slice(0,3), cur=CY[3];
  const rec=past.map(c=>({c,tb:c.B1-c.T,br:c.R-c.B1,tr:c.R-c.T,tt:c.next.T-c.T,rh:c.R-c.next.H,dd:price(c.B1)/price(c.T)-1}));

  const est={avg:cur.T+Math.round(avg('tr')), trend:cur.T+Math.round(trendTR), bot:cur.B1+Math.round(avg('br')), nextTop:cur.T+Math.round(avg('tt'))};
  return {rec,avg,trendTR,el,curDd,est,minTR:Math.min(...rec.map(r=>r.tr)),maxTR:Math.max(...rec.map(r=>r.tr)),reclaimed:cur.R!=null};

const DCA={amt:100,freq:7};

function computeDCA(F){
  const bp=F.bp, base=price(bp.e), H=bp.hs, out=[];
  for(const x of F.sc){
    const p=h=>F.now*ex(x.k*(ln(price(bp.e+h))-ln(base)));
    let coins=0, inv=0, n=0; const path=[];
    for(let h=0; h<=H; h+=DCA.freq){ const px=p(h); if(!(px>0)) continue; coins+=DCA.amt/px; inv+=DCA.amt; n++; path.push([S.d1+h,inv,coins*px]); }
    const val=coins*x.target, lumpVal=inv*(1+x.ret);
    // worst paper drawdown along the way (value vs invested)
    let worst=0; for(let h=0; h<=H; h+=DCA.freq){ const pt=path.find(q=>q[0]===S.d1+h); if(pt){ const r=pt[2]/pt[1]-1; if(r<worst) worst=r; } }
    out.push({key:x.key,n,inv,coins,val,ret:val/inv-1,avg:inv/coins,lumpVal,lumpRet:x.ret,target:x.target,worst,path,years:H/365.25});
  }
  return out;
}

  document.getElementById('legend1').innerHTML=items.map(([id,col,lab,dash])=>`<span data-id="${id}" class="${st.hidden.has(id)?'off':''}"><i class="${dash?'dash':''}" style="background:${col}"></i>${lab}</span>`).join('');
  document.querySelectorAll('#legend1 span').forEach(el=>el.onclick=()=>{const id=el.dataset.id; st.hidden.has(id)?st.hidden.delete(id):st.hidden.add(id); render();});
}
function renderScore(M){
  const sorted=[...M].sort((a,b)=>b.score-a.score), an=ANAME();
  const winTxt={anchor:K('기준점→현재','anchor→today'),365:K('최근 365일','last 365 days'),180:K('최근 180일','last 180 days'),full:K('전체 구간','full range')}[st.win];
  document.getElementById('scoreSub').textContent=K(`비교 구간: ${winTxt} (${Dlab(M[0].xs)} ~ ${Dlab(M[0].t)}, ${M[0].n}일) · 기준점: ${an[st.anchor]}`,`Window: ${winTxt} (${Dlab(M[0].xs)} to ${Dlab(M[0].t)}, ${M[0].n} days) · anchor: ${an[st.anchor]}`);
  document.getElementById('scoreTbl').innerHTML=`<tr><th>${K('사이클','Cycle')}</th><th>${K('종합 유사도','Score')}</th><th>${K('수익률 r','Return r')}</th><th>${K('레벨 r','Level r')}</th><th>${K('진폭비 β','Amplitude β')}</th><th>${K('형태 오차','Shape err.')}</th></tr>`+
    sorted.map(m=>`<tr><td class="name"><span class="sw" style="background:${m.c.color}"></span>${cname(m.c)} <span class="muted">${m.c.yr}</span></td><td><b>${m.score.toFixed(1)}</b><span class="bar"><b style="width:${Math.max(0,Math.min(100,m.score))}%;background:${m.c.color}"></b></span></td><td>${m.rR.toFixed(3)}</td><td>${m.rL.toFixed(3)}</td><td>${m.beta.toFixed(3)}</td><td>±${((ex(m.rmseShape)-1)*100).toFixed(1)}%</td></tr>`).join('');
  const b=sorted[0], md=`${Dlab(b.dtw.matchX)} (${ds(anchorDay(b.c,st.anchor)+b.dtw.matchX)})`;
  const lagKo=Math.abs(b.lag)<4?'시간축으로는 거의 동일한 속도로':(b.lag>0?`시간축으로 약 <b>${b.lag}일 앞서</b>`:`시간축으로 약 <b>${-b.lag}일 뒤처져</b>`);
  const lagEn=Math.abs(b.lag)<4?'at almost the same pace':(b.lag>0?`about <b>${b.lag} days ahead</b>`:`about <b>${-b.lag} days behind</b>`);
  document.getElementById('insight').innerHTML=K(
    `현재 사이클은 <b>${cname(b.c)}(${b.c.yr})</b>와 가장 유사합니다(종합 ${b.score.toFixed(0)}점). 같은 경과일 기준 현재 경로는 ${cname(b.c)} 대비 평균 <b>${pct(ex(b.bias)-1)}</b> 수준이고 진폭은 <b>${b.beta.toFixed(2)}배</b>이며, ${lagKo} 진행 중입니다. DTW 대응점으로 보면 오늘은 ${cname(b.c)}의 <b>${md}</b>에 해당합니다.`,
    `The current cycle most resembles <b>${cname(b.c)} (${b.c.yr})</b> (score ${b.score.toFixed(0)}). At the same elapsed day it sits <b>${pct(ex(b.bias)-1)}</b> versus ${cname(b.c)} on average, moves with <b>${b.beta.toFixed(2)}×</b> the amplitude, and is running ${lagEn}. By DTW, today corresponds to ${cname(b.c)}'s <b>${md}</b>.`);
}

   `<tr class="avg"><td class="name">${K('평균','Average')}</td><td>${pct(ex(aB)-1)}</td><td>—</td><td>${aBe.toFixed(3)}</td><td>—</td><td>${sgn(aL,0,dU())}</td><td>${sgn(aD,0,dU())}</td><td>—</td><td>—</td></tr>`+

function renderTimeline(){

function splitRow(line,sep){const out=[];let cur='',q=false;for(const ch of line){if(ch==='"'){q=!q;continue}if(ch===sep&&!q){out.push(cur);cur='';continue}cur+=ch}out.push(cur);return out.map(s=>s.trim())}
function parseDate(s){ s=s.trim(); if(/^\d{10,13}$/.test(s)){const n=+s; return Math.floor((s.length===13?n:n*1000)/DAY)}
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/); if(m) return Math.round(Date.UTC(+m[1],m[2]-1,+m[3])/DAY);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return Math.round(Date.UTC(+m[3],m[1]-1,+m[2])/DAY);
  const t=Date.parse(s); return isNaN(t)?NaN:Math.floor(t/DAY); }
function parseCSV(txt){
  const lines=txt.split(/\r?\n/).filter(l=>l.trim()); const sep=(lines[0].split(';').length>lines[0].split(',').length)?';':',';
  const head=splitRow(lines[0],sep).map(h=>h.toLowerCase().replace(/[^a-z ]/g,'').trim());
  let di=head.findIndex(h=>/^(date|time|timestamp|snappedat|snapped at|timeopen|time open|day)$/.test(h.replace(/\s+/g,' ')));
  let pi=head.findIndex(h=>h==='close'||h==='close price'||h==='closeusd'); if(pi<0) pi=head.findIndex(h=>h==='price'||h==='adj close'||h.includes('close'));
  let startRow=1; if(di<0&&pi<0){di=0;pi=1;startRow=isNaN(parseDate(splitRow(lines[0],sep)[0]))?1:0} if(di<0) di=0; if(pi<0) pi=1;
  const m=new Map(); for(let i=startRow;i<lines.length;i++){const r=splitRow(lines[i],sep); const d=parseDate(r[di]||''); const v=parseFloat((r[pi]||'').replace(/[$,\s]/g,'')); if(isFinite(d)&&v>0) m.set(d,v)}
  return [...m.entries()].sort((a,b)=>a[0]-b[0]);
}

// Price: /simple/price every 15 min · Daily closes: /coins/bitcoin/market_chart?days=365 (00:00 UTC points) hourly.
// window.__BTCCT_INJECT = {price:{usd,usd_24h_change,last_updated_at}, prices:[[ms,usd],...]} replaces network calls (used by scripts/draft-posts.mjs).
const API='https://api.coingecko.com/api/v3';
let LIVE=null, LAST_M=null, CG_ST={state:'init',code:null}, LAST_F=null, LAST_A=null;
const fmtTime=ts=>{ try{ return new Date(ts).toLocaleString(LANG==='en'?'en-US':'ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) }catch(e){ return '' } };
function chartToCloses(o){
  if(!o||!Array.isArray(o.prices)||o.prices.length<2) return [];
  const P=o.prices, n=P.length, st=+o.startTs, en=+o.endTs, step=(en-st)/(n-1), now=Date.now(), out=[];
  for(let i=0;i<n;i++){ const pair=Array.isArray(P[i]); const ts=pair?+P[i][0]:st+i*step, v=pair?+P[i][1]:+P[i];
    if(!(v>0)||!isFinite(ts)) continue; const m=Math.round(ts/DAY); if(m*DAY>now) continue;
    out.push([m-1, v, Math.abs(ts-m*DAY)]); }
  return out;
}
function mergeCloses(list){ const m=new Map(); list.forEach(([d,v,e])=>{ const c=m.get(d); if(!c||e<c[1]) m.set(d,[v,e]); }); return [...m.entries()].map(([d,[v,e]])=>[d,v,e]).sort((a,b)=>a[0]-b[0]); }

function renderLive(){

  if(s==='live'){ cl='on'; html=`<span class="pulse"></span><span><b>LIVE</b> · CoinGecko · ${K('시세 15분 · 분석 일 종가(UTC)','price 15 min · analysis on daily UTC close')}<br>${K('시세','price')} ${LIVE?fmtTime(LIVE.ts):'—'} · ${K('최근 종가','last close')} ${S&&S.cgRange?ds(S.cgRange[1]):'—'}</span>`; }

async function getJSON(path){ const r=await fetch(API+path,{cache:'no-store'}); if(!r.ok){ const e=new Error('HTTP '+r.status); e.code=r.status===429?'rate_limited':'http'; throw e; } return r.json(); }
function applyPrice(b){ if(!b||!(b.usd>0)) return; LIVE={price:+b.usd,ch24:+b.usd_24h_change,ts:b.last_updated_at?b.last_updated_at*1000:Date.now()}; CG_ST={state:'live',code:null}; if(LAST_M){ renderKPIs(LAST_M); renderForecast(LAST_M); renderNow(); } renderLive(); }
function applyDaily(prices){
  const add=chartToCloses({prices}); if(!add.length) return;
  const before=cgCloses().slice(-1)[0];
  const prev=LS.get('btcct_cg2')||[]; LS.set('btcct_cg2',mergeCloses(prev.filter(p=>p[0]>=Math.floor(Date.now()/DAY)-400).concat(add)));

}
